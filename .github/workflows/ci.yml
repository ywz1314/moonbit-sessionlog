name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install latest MoonBit stable
        uses: hustcer/setup-moonbit@v1

      - name: Show toolchain
        run: moon version --all

      - name: Format source
        run: moon fmt

      - name: Verify formatting is committed
        run: git diff --exit-code

      - name: Generate public interfaces
        run: moon info

      - name: Verify generated interfaces are committed
        run: git diff --exit-code

      - name: Type-check every target
        run: moon check --target all --deny-warn

      - name: Run every-target tests
        run: moon test --target all --deny-warn

      - name: Native coverage
        if: runner.os == 'Linux'
        run: |
          moon test --target native --deny-warn --enable-coverage
          moon coverage report
          moon coverage analyze

      - name: Enforce production source scale
        if: runner.os == 'Linux'
        shell: bash
        run: |
          lines=$(find . -type f -name '*.mbt' \
            ! -path './_build/*' \
            ! -name '*_test.mbt' \
            ! -name '*_wbtest.mbt' \
            -print0 | xargs -0 awk 'NF && $0 !~ /^[[:space:]]*\/\// { count++ } END { print count + 0 }')
          echo "Non-comment production MoonBit source lines: ${lines}"
          test "${lines}" -ge 20000
