name: Publish Mooncakes package

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install latest stable MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Validate package before publishing
        run: |
          moon fmt
          moon info
          git diff --exit-code
          moon check --target all --deny-warn
          moon test --target native --deny-warn

      - name: Configure Mooncakes credentials
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: |
          mkdir -p "$HOME/.moon"
          printf '{"token":"%s"}\n' "$MOONCAKES_TOKEN" > "$HOME/.moon/credentials.json"
          chmod 600 "$HOME/.moon/credentials.json"

      - name: Publish to Mooncakes
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: moon publish --frozen
